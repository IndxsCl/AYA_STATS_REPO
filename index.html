<!DOCTYPE html>
<html lang="es">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Squad Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <h1>VALORANT <span>SQUAD TRACKER</span></h1>
    </header>

    <main class="container">
        <section class="card-panel">
            <h2>Registrar Nueva Partida</h2>
            <form id="stats-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="player-name">Jugador</label>
                        <select id="player-name" required>
                            <option value="" disabled selected>Selecciona jugador...</option>
                            <option value="Joker">Joker</option>
                            <option value="Viper">Viper</option>
                            <option value="Phoenix">Phoenix</option>
                            <option value="Sova">Sova</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="agent-name">Agente</label>
                        <select id="agent-name" required>
                            <option value="" disabled selected>Selecciona agente...</option>
                            <option value="Jett">Jett</option>
                            <option value="Reyna">Reyna</option>
                            <option value="Raze">Raze</option>
                            <option value="Omen">Omen</option>
                            <option value="Killjoy">Killjoy</option>
                            <option value="Sage">Sage</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="kills">Kills (K)</label>
                        <input type="number" id="kills" min="0" placeholder="0" required>
                    </div>

                    <div class="form-group">
                        <label for="deaths">Deaths (D)</label>
                        <input type="number" id="deaths" min="0" placeholder="0" required>
                    </div>

                    <div class="form-group">
                        <label for="assists">Assists (A)</label>
                        <input type="number" id="assists" min="0" placeholder="0" required>
                    </div>

                    <div class="form-group">
                        <label for="acs">ACS</label>
                        <input type="number" id="acs" min="0" placeholder="Promedio de Combate" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Guardar Estadísticas</button>
                    <button type="button" id="btn-delete" class="btn-danger">Resetear Todo</button>
                </div>
            </form>
        </section>

        <section class="card-panel">
            <div class="panel-header-flex">
                <h2>Tabla General de la Squad</h2>
                <div class="filter-timeline-container">
                    <button id="filter-all" class="btn-filter active">Acumulado</button>
                    <button id="filter-week" class="btn-filter">Esta Semana</button>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>JUGADOR</th>
                            <th>PARTIDAS</th>
                            <th>PROMEDIO K/D/A</th>
                            <th>K/D</th>
                            <th>KDA RATIO</th>
                            <th>ACS PROM.</th>
                        </tr>
                    </thead>
                    <tbody id="stats-table-body">
                        </tbody>
                </table>
            </div>
        </section>

        <section class="card-panel">
            <h2>Rendimiento Individual por Personajes</h2>
            <div id="tabs-container">
                </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
